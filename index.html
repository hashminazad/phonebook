<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phonebook Application</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
 
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="mt-5 maindiv d-flex justify-content-center rounded-3" style="width: 60vw; height: fit-content;">


    <div class="d-flex flex-column align-items-center  mt-3">
      
        <div class=" text-white fw-bolder fontsize">📞 Phonebook Application</div>
        
        <div class="mt-5 row gap-4" style="width: 50vw;" id="newContact">
          <input type="text" placeholder="Enter name" id="contactName" class=" col-md-4 col-12 " >
          <input type="number" placeholder="Enter phone number"  id="phoneNumber" class="col-md-4 col-12 spin">
          <button class="col-md-2 col-12 fs-6 fw-bold "  id="addContact">Add <span class="d-none d-lg-inline-block"  >Contact</span></button>
        </div>
        
        <input type="text" placeholder="Search Contact" class="mt-4" style="width: 30vw;" id="searchContact">
        <h4 class="text-white fs-3 fw-bold mt-5 mb-4 text-decoration-underline" >All Contacts</h4>   

        <div>
        
          <div id="contactlist"></div>
        </div>
    </div>


  </div>

  
  <script src="script.js"></script>
</body>
</html>
